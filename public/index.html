<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Board</title>
  <!-- Installable: Safari → Share → Add to Home Screen opens it full-screen like an app. -->
  <link rel="manifest" href="/api/manifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#111827">
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6feb'/%3E%3Cpath d='M18 34l10 10 18-22' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="topbar">
    <div class="inner">
      <a class="brand" href="/"><span class="mark" id="brandMark">✓</span><span class="names"><span id="brandName">Daily Board</span><span class="tag" id="brandTag"></span></span></a>
      <span class="mini" id="topRight"></span>
      <button class="refresh-btn" id="bellBtn" type="button" onclick="toggleNotifications()" aria-label="Notifications" title="Turn on notifications" hidden>🔕</button>
      <button class="refresh-btn" id="refreshBtn" type="button" onclick="refreshNow()" aria-label="Refresh" title="Refresh" hidden>↻</button>
    </div>
  </nav>
  <div class="wrap">
    <div id="app"><p class="empty">Loading…</p></div>
  </div>
  <div id="modal"></div>
  <script src="board.js"></script>
</body>
</html>
